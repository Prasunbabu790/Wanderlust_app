<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff5a5f" />
      <stop offset="100%" stop-color="#fe424d" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#fe424d" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular background badge -->
  <circle cx="32" cy="32" r="30" fill="url(#grad)" filter="url(#shadow)"/>
  <circle cx="32" cy="32" r="27" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Compass Outer Ring -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="#ffffff" stroke-width="2.5"/>

  <!-- Compass Cardinal Ticks -->
  <line x1="32" y1="10" x2="32" y2="13" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="51" x2="32" y2="54" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="10" y1="32" x2="13" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="51" y1="32" x2="54" y2="32" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

  <!-- North Needle (White) -->
  <polygon points="32,17 36.5,32 32,29.5" fill="#ffffff"/>
  <polygon points="32,17 27.5,32 32,29.5" fill="#f0f0f0"/>

  <!-- South Needle (Dark Accent) -->
  <polygon points="32,47 36.5,32 32,34.5" fill="#222222"/>
  <polygon points="32,47 27.5,32 32,34.5" fill="#333333"/>

  <!-- Center Pivot Pin -->
  <circle cx="32" cy="32" r="3" fill="#ffffff"/>
  <circle cx="32" cy="32" r="1.5" fill="#fe424d"/>
</svg>
